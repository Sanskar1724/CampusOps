# Render Blueprint — CampusOps
# Free deployment: API + PostgreSQL

databases:
  - name: campusops-db
    databaseName: campusops
    user: campusops
    plan: free

services:
  - type: web
    name: campusops-api
    runtime: python
    plan: free

    buildCommand: pip install -r backend/requirements.txt

    # FREE TIER: single web service runs API + worker + Telegram poller as background jobs.
    # Separate worker/telegram services would require paid plan — so we keep them together.
    startCommand: sh -c "python -m scripts.init_db && (python -m backend.app.jobs.worker & TELEGRAM_SELF_HOST=1 python -m backend.app.comms.runner & python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT)"

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campusops-db
          property: connectionString

      - key: APP_SECRET_KEY
        generateValue: true

      - key: OPENAI_API_KEY
        sync: false

      - key: OPENAI_BASE_URL
        value: https://openrouter.ai/api/v1

      - key: MODEL
        value: nex-agi/nex-n2.5-mini:free

      - key: CASPIAN_API_KEY
        sync: false

      - key: CASPIAN_BASE_URL
        value: https://api.trycaspianai.com

      - key: CAMPUSOPS_MAILBOX
        value: campusops

      - key: TELEGRAM_BOT_TOKEN
        sync: false

      - key: GMAIL_CLIENT_ID
        sync: false

      - key: GMAIL_CLIENT_SECRET
        sync: false

      - key: GMAIL_REDIRECT_URI
        sync: false

      - key: FRONTEND_URLS
        sync: false

      - key: PYTHON_VERSION
        value: 3.13.4