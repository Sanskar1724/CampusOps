services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: campusops
      POSTGRES_PASSWORD: campusops
      POSTGRES_DB: campusops
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusops"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://campusops:campusops@db:5432/campusops
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://campusops:campusops@db:5432/campusops
    depends_on:
      db:
        condition: service_healthy

  caspian:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://campusops:campusops@db:5432/campusops
    command: ["python", "-m", "backend.app.comms.runner"]
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
